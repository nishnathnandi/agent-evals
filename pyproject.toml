[project]
name = "agent-evals"
version = "0.1.0"
description = "this is deploy a sample agent to AWS agent code runtime and setup evaluations"
authors = [
    {name = "nishnath",email = "nishnath.nandi@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "boto3 (>=1.43.72,<2.0.0)",
    "bedrock-agentcore (>=1.21.0,<2.0.0)",
    "bedrock-agentcore-starter-toolkit (>=0.3.11,<0.4.0)",
    "strands-agents (>=1.52.0,<2.0.0)",
    "strands-agents-tools (>=0.8.6,<0.9.0)",
    "aws-opentelemetry-distro (>=0.19.0,<0.20.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[tool.poetry]
packages = [{include = "agent"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.3,<0.17.0)"
]
